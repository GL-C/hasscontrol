name: Enduro 3 build

on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Connect IQ SDK and device definitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ciq"
          curl --fail --location --retry 3 https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-lin-9.2.0-2026-06-09-92a1605b2.zip -o "$RUNNER_TEMP/sdk.zip"
          echo "4907d8455b651c5a00a865e364cc4f1921c055b9279c7c8634c7a7a6773b5593  $RUNNER_TEMP/sdk.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$RUNNER_TEMP/ciq"
          # Inherited device mirror; SDK Manager can supply official definitions locally.
          curl --fail --location --retry 3 https://hatl.at/devices.zip -o "$RUNNER_TEMP/devices.zip"
          unzip -q "$RUNNER_TEMP/devices.zip" -d "$HOME"
          echo "$RUNNER_TEMP/ciq/bin" >> "$GITHUB_PATH"
      - name: Generate temporary development signing key
        run: |
          openssl genrsa -out "$RUNNER_TEMP/key.pem" 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/key.der" -nocrypt
      - name: Compile app and regression tests
        working-directory: widget
        run: |
          mkdir -p ../build
          monkeyc -y "$RUNNER_TEMP/key.der" -f monkey.jungle -d enduro3 -w -o ../build/hasscontrol-enduro3.prg
          monkeyc -y "$RUNNER_TEMP/key.der" -f monkey.jungle -d enduro3 -t -w -o ../build/hasscontrol-tests.prg
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hasscontrol-enduro3
          path: build/hasscontrol-enduro3.prg
          if-no-files-found: error
